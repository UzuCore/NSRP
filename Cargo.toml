[package]
name = "nsrp"
version = "1.1.2"
edition = "2024"
rust-version = "1.93"
build = "build.rs"

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Only the hot AES/CTR data path is optimized for throughput. The rest of
# the compact GUI/extraction binary keeps the existing size-first profile.
[profile.release.package.aes]
opt-level = 3
[profile.release.package.ctr]
opt-level = 3
[profile.release.package.cipher]
opt-level = 3

# The virtual BKTR mapper, RomFS walker and streaming NCZ/NCA codecs live in
# our crate, not in aes/ctr. Keep the UI dependencies size-optimized but
# compile our own hot loops for throughput.
[profile.release.package.nsrp]
opt-level = 3

[dependencies]
anyhow = "1"
aes = "0.9.2"
byteorder = "1"
cipher = "0.5.2"
ctr = "0.10.1"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
getrandom = "0.4"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
num_cpus = "1"
parking_lot = "0.12"
rayon = "1"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sevenz-rust2 = { version = "=0.25.0", default-features = false, features = ["aes256", "bzip2", "deflate", "ppmd", "util"] }
sha2 = "0.10"
slint = { version = "1.17.1", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "compat-1-2", "unstable-winit-030"] }
tempfile = "3"
walkdir = "2"
xts-mode = "0.6"
zstd = { version = "0.13", features = ["zstdmt"] }
zip = { version = "8.3", default-features = false, features = ["aes-crypto", "deflate-flate2-zlib-rs"] }

[build-dependencies]
slint-build = "1.17.1"
winresource = "0.1"

[dev-dependencies]
sevenz-rust2 = { version = "=0.25.0", default-features = false, features = ["compress"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32", "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
